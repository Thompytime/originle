<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Originle moderation</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#150e22;color:#f6eee1;font:16px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px}h1{color:#e8a55e}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;background:#2a1d42;border:1px solid #594b6e;color:#fff;border-radius:4px}button{padding:10px 14px;border:0;border-radius:4px;background:#c97b3c;color:#150e22;font-weight:700;cursor:pointer}.ghost{background:transparent;color:#f6eee1;border:1px solid #594b6e}.reject{border-color:#ff3d7f;color:#ff3d7f}.login{display:flex;gap:8px;max-width:600px}.login input{flex:1}.item{border:1px solid #594b6e;padding:16px;margin:16px 0;border-radius:5px}.line{font-size:20px}.meta{color:#b9afc4}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.reason{margin-top:10px}.status{min-height:24px;color:#5be0b4}@media(max-width:560px){.login{display:block}.login button{width:100%;margin-top:8px}}
</style>
</head>
<body><main class="wrap"><h1>Originle moderation</h1><p>This private page never appears on the public board.</p>
<div class="login"><input id="token" type="password" autocomplete="current-password" placeholder="Admin token"><button id="load">Sign in / refresh</button><button class="ghost" id="logout">Log out</button></div>
<p class="status" id="status"></p><h2>Listings waiting for approval</h2><section id="queue"></section><h2>Open reports</h2><section id="reports"></section></main>
<script>
const q=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
async function load(){q('#status').textContent='Loading…';const token=q('#token').value.trim();if(token){const lr=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const ld=await lr.json();if(!lr.ok){q('#status').textContent=ld.error||'Sign-in failed';return}q('#token').value=''}const [pr,rr]=await Promise.all([fetch('/api/admin/pending'),fetch('/api/admin/reports')]);const [p,d]=await Promise.all([pr.json(),rr.json()]);if(!pr.ok||!rr.ok){q('#status').textContent=p.error||d.error||'Sign in with the admin token.';return}q('#status').textContent=`${p.listings.length} listings and ${d.reports.length} reports waiting`;q('#queue').innerHTML=p.listings.map(x=>`<article class="item" data-id="${esc(x.id)}"><p class="line">“${esc(x.pitch)}”</p><p class="meta"><b>${esc(x.name)}</b>, ${x.age} · ${esc(x.area)}, ${esc(x.country)} · ${esc(x.gender)} looking for ${esc(x.seek)}<br>${esc(x.plat)} ${esc(x.handle)} ${esc(x.link)}<br>Paid £${(x.pence/100).toFixed(2)}</p><textarea class="reason" rows="2" placeholder="Rejection reason"></textarea><div class="actions"><button data-action="approve">Approve</button><button class="ghost reject" data-action="reject">Reject and refund</button></div></article>`).join('')||'<p>Nothing waiting.</p>';q('#reports').innerHTML=d.reports.map(x=>`<article class="item report" data-report="${esc(x.id)}"><p><b>${esc(x.reason)}</b>${x.urgent?' · URGENT':''}</p><p>${esc(x.details)}</p><p class="line">“${esc(x.listing?.pitch||'Listing unavailable')}”</p><p class="meta">${esc(x.listing?.name||'')} · status: ${esc(x.listing?.status||'missing')} · reference ${esc(x.id)}</p><div class="actions"><button data-report-action="restore">Restore listing / reject report</button><button class="ghost reject" data-report-action="remove">Remove listing</button><button class="ghost" data-report-action="close">Close report only</button></div></article>`).join('')||'<p>No open reports.</p>'}
q('#load').onclick=load;q('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});q('#queue').innerHTML='';q('#reports').innerHTML='';q('#status').textContent='Logged out.'};q('#queue').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const card=b.closest('.item');b.disabled=true;const body={listingId:card.dataset.id,action:b.dataset.action,reason:card.querySelector('.reason').value};const r=await fetch('/api/admin/moderate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){q('#status').textContent=d.error||'Action failed';b.disabled=false;return}card.remove();q('#status').textContent=body.action==='approve'?'Approved and live.':'Rejected and refunded.'};
q('#reports').onclick=async e=>{const b=e.target.closest('button[data-report-action]');if(!b)return;const card=b.closest('[data-report]');b.disabled=true;const r=await fetch('/api/admin/report-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reportId:card.dataset.report,action:b.dataset.reportAction})});const d=await r.json();if(!r.ok){q('#status').textContent=d.error||'Report action failed';b.disabled=false;return}card.remove();q('#status').textContent='Report closed.'};
</script></body></html>
